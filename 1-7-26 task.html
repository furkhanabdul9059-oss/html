<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height:100vh ;
            margin: 0px;
        }
        .container{
            height: 600px;
            width: 600px;
            border: 5px solid black;
            display: flex;
            background-color: aqua;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }
        .one{
            height: 400px;
            width: 400px;
            border: 5px solid blue;
            background-color: darkkhaki;
            border-radius: 50%;
            justify-content: center;
            align-items: center;
            display: flex;
        }
        .two{
            height: 180px;
            width: 180px;
            border: 5px solid gold;
            background-color: palevioletred;
            border-radius: 50%;
            justify-content: center;
            align-items: center;
            display: flex;
        }
        h1{
            color: black;
            font-size: 30px;
            text-align: center;
            margin: 0;
            text-shadow: 3px 3px 5px gray;
        }
    </style>
</head>
<body>
 <div class="container">
    <div class="one">
        <div class="two">
            <h1>Abdul Furkhan<br></h1>
        </div>
    </div>
 
 </div>
    
</body>
</html>
